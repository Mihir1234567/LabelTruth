# Render Infrastructure as Code (Blueprint)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: labeltruth-food-ml
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python train_pipeline.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
